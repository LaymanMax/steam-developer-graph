[package]
name = "steam-developer-graph-backend"
version = "0.1.0"
edition = "2024"

[lib]
name = "steam_developer_graph"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[dependencies]
arrow = "60.1.0"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.8", features = ["derive"] }
csv = "1.4.0"
hex = "0.4.3"
parquet = "60.1.0"
r2d2 = "0.8.10"
r2d2_sqlite = "0.37.1"
regex = "1.13.2"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
rusqlite = { version = "0.42.0", features = ["bundled", "chrono", "serde_json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
strsim = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs", "compression-full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.26"
