name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Rust Backend (Check, Test & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend -> target"

      - name: Check backend targets
        run: cargo check --manifest-path backend/Cargo.toml --all-targets

      - name: Run backend unit and integration tests
        run: cargo test --manifest-path backend/Cargo.toml --lib --bins --tests

      - name: Build backend binaries
        run: cargo build --manifest-path backend/Cargo.toml --bins

  frontend:
    name: React Frontend (Typecheck, Test & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        working-directory: frontend
        run: pnpm test

      - name: Build frontend application
        working-directory: frontend
        run: pnpm build
